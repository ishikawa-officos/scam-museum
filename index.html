<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />

    <title>だまされる博物館 — ようこそ、安心して騙される場所へ</title>
    <meta
      name="description"
      content="実際に使われている詐欺の手口を、一円も失わずに体験できる展示。全4室。どれだけ騙されてもお金は減りません。出口では仕掛けをすべてお見せします。"
    />

    <!--
      OGP の画像・URL は絶対URLでないと一部のSNSで読まれない。
      公開ドメインが決まったら、次の2行の VITE_PUBLIC_ORIGIN を .env.production に設定すること。
      例: VITE_PUBLIC_ORIGIN=https://damasareru-museum.example
      設定漏れは npm run check-release で検出できる。
    -->
    <meta property="og:url" content="%VITE_PUBLIC_ORIGIN%/" />
    <link rel="canonical" href="%VITE_PUBLIC_ORIGIN%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="だまされる博物館" />
    <meta property="og:title" content="だまされる博物館 — ようこそ、安心して騙される場所へ" />
    <meta
      property="og:description"
      content="実際に使われている詐欺の手口を、一円も失わずに体験できる展示。全4室。あの罠、たぶんあなたも見抜けません。"
    />
    <meta property="og:image" content="%VITE_PUBLIC_ORIGIN%/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="だまされる博物館 — ようこそ、安心して騙される場所へ" />
    <meta
      name="twitter:description"
      content="実際に使われている詐欺の手口を、一円も失わずに体験できる展示。全4室。あの罠、たぶんあなたも見抜けません。"
    />
    <meta name="twitter:image" content="%VITE_PUBLIC_ORIGIN%/ogp.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
