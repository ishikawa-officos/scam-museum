<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />

    <title>だまされる博物館 — ようこそ、安心して騙される場所へ</title>
    <meta
      name="description"
      content="実際に使われている詐欺の手口を、一円も失わずに体験できる展示。全4室。どれだけ騙されてもお金は減りません。出口では仕掛けをすべてお見せします。"
    />

    <!--
      OGP の画像・URL は絶対URLでないと一部のSNSで読まれない。
      公開ドメインが決まったら、次の2行の VITE_PUBLIC_ORIGIN を .env.production に設定すること。
      例: VITE_PUBLIC_ORIGIN=https://damasareru-museum.example
      設定漏れは npm run check-release で検出できる。
    -->
    <meta property="og:url" content="%VITE_PUBLIC_ORIGIN%/" />
    <link rel="canonical" href="%VITE_PUBLIC_ORIGIN%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="だまされる博物館" />
    <meta property="og:title" content="だまされる博物館 — ようこそ、安心して騙される場所へ" />
    <meta
      property="og:description"
      content="実際に使われている詐欺の手口を、一円も失わずに体験できる展示。全4室。あの罠、たぶんあなたも見抜けません。"
    />
    <meta property="og:image" content="%VITE_PUBLIC_ORIGIN%/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="だまされる博物館 — ようこそ、安心して騙される場所へ" />
    <meta
      name="twitter:description"
      content="実際に使われている詐欺の手口を、一円も失わずに体験できる展示。全4室。あの罠、たぶんあなたも見抜けません。"
    />
    <meta name="twitter:image" content="%VITE_PUBLIC_ORIGIN%/ogp.png" />

    <!-- フォントは自前で配っている（scripts/build-fonts.mjs が生成）。
         最初に目に入る2つだけ先読みする。本文の Noto 400 と、
         エントランスの大見出しに使う Zen Kaku 900。
         残りの2つは CSS から必要になった時点で取りに行かせる。 -->
    <link
      rel="preload"
      href="/fonts/noto-sans-jp-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/zen-kaku-900.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
